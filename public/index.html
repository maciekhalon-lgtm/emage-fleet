<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Emage FLEET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Barlow:wght@400&display=swap">
<style>
  :root{--bg:#0e131a;--surface:#161d27;--ink:#e5eaf1;--muted:#93a0b3;--line:#29333f;--accent:#f0b429;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;padding:24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 28px;max-width:420px;width:100%;text-align:center}
  h1{font-family:"Barlow Semi Condensed",Arial Narrow,sans-serif;font-size:34px;margin:0 0 6px;font-weight:500}
  h1 b{font-weight:700;letter-spacing:.14em;color:var(--accent)}
  p{color:var(--muted);margin:6px 0 0;line-height:1.5}
</style>
</head>
<body>
  <main class="card">
    <h1>Emage <b>FLEET</b></h1>
    <p>Flota firmowa Emage Group</p>
    <p>Aplikacja jest w przygotowaniu.</p>
  </main>
</body>
</html>
