<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emage FLEET">
<title>Emage FLEET</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikona-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><h1 class="wordmark"><span>Emage</span> <b>FLEET</b></h1><small>Flota firmowa Emage Group</small></div>
    <form id="auth-form" novalidate></form>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 15.5V12l2-5h10l3.5 5H21v3.5" stroke="#f0b429" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="16.5" r="2" fill="#f0b429"/><circle cx="16.5" cy="16.5" r="2" fill="#f0b429"/></svg>
      </div>
      <div><h1 class="wordmark"><span>Emage</span> <b>FLEET</b></h1><small>Flota firmowa Emage Group</small></div>
    </div>
    <div class="top-right"><div class="who" id="who" hidden></div><div class="sync" id="sync"><i></i><span>Łączenie…</span></div></div>
  </header>

  <div id="notices"></div>

  <section class="strip" id="strip" aria-label="Podsumowanie"></section>

  <nav class="tabs" id="tabs" aria-label="Sekcje">
    <a href="#moje" data-tab="moje" id="tab-moje" hidden>Moje auto</a>
    <a href="#pojazdy" data-tab="pojazdy">Pojazdy <span class="count" id="c-pojazdy">0</span></a>
    <a href="#terminy" data-tab="terminy">Terminy <span class="count" id="c-terminy">0</span></a>
    <a href="#usterki" data-tab="usterki">Usterki <span class="count" id="c-usterki">0</span></a>
    <a href="#przydzial" data-tab="przydzial">Przydział i rezerwacje <span class="count" id="c-przydzial">0</span></a>
    <a href="#koszty" data-tab="koszty">Koszty i paliwo</a>
    <a href="#raporty" data-tab="raporty" id="tab-reports" hidden>Raporty</a>
    <a href="#historia" data-tab="historia" id="tab-history" hidden>Historia</a>
    <a href="#uzytkownicy" data-tab="uzytkownicy" id="tab-users" hidden>Użytkownicy <span class="count" id="c-uzytkownicy" hidden></span></a>
  </nav>

  <main id="view"></main>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" novalidate>
    <header><h2 id="dlg-title">Formularz</h2><button type="button" class="ghost" data-action="close" aria-label="Zamknij">✕</button></header>
    <div class="body" id="dlg-body"></div>
    <footer>
      <button type="button" class="danger" id="dlg-del" hidden>Usuń</button>
      <div class="right"><button type="button" data-action="close">Anuluj</button><button type="submit" class="primary" id="dlg-save">Zapisz</button></div>
    </footer>
  </form>
</div>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="rdzen.js"></script>
<script src="role.js"></script>
<script src="formularz.js"></script>
<script src="zdjecia.js"></script>
<script src="pojazdy.js"></script>
<script src="karta-pojazdu.js"></script>
<script src="terminy.js"></script>
<script src="usterki.js"></script>
<script src="rezerwacje.js"></script>
<script src="kalendarz.js"></script>
<script src="wydania.js"></script>
<script src="koszty.js"></script>
<script src="statystyki.js"></script>
<script src="raporty.js"></script>
<script src="historia.js"></script>
<script src="import.js"></script>
<script src="uzytkownicy.js"></script>
<script src="kierowca.js"></script>
<script src="powiadomienia.js"></script>
<script src="app.js"></script>
<script src="baza.js"></script>
<script src="auth.js"></script>
</body>
</html>
